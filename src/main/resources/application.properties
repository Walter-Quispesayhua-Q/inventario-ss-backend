# Spring Boot 3.5.5 | Java 25 | PostgreSQL
spring.application.name=Inventario
spring.profiles.active=dev

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/gestion_inventario_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:POSTGRES}

# JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dynamic-insert=true
spring.jpa.hibernate.ddl-auto=none

# Flyway
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=inventario,seguridad,configuracion,personas,ubicaciones,estructuras,auditoria
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=0

# GraphQL
spring.graphql.graphiql.enabled=true

# JWT
application.security.jwt.secret-key=${JWT_SECRET:O0bKj6c44OPd+jLaBqxf9OCzjpql9mdcHfS+bLhVlsI=}
application.security.jwt.expiration=86400000

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:walicodigotesting@gmail.com}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Multipart
spring.servlet.multipart.enabled=true

# Logging
logging.level.com.example.inventario=DEBUG
logging.level.org.springframework.graphql=DEBUG
logging.level.graphql.execution=DEBUG
logging.level.graphql.schema=DEBUG
logging.level.com.example.inventario.inventario.mapper=TRACE
logging.level.com.example.inventario.inventario.service.importacion=TRACE
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{20} - %msg%n

# ML Templates
inventario.plantillas.directorio=seed/plantillas
inventario.plantillas.config=_config/index.json

# Initialization
inventario.inicializacion.sincronizar-plantillas.habilitado=true
app.seed.estructuras.enabled=true