# Perfil de Produccion/Docker
# Este archivo sobreescribe las propiedades de application.properties

# Flyway - habilitado para crear/migrar tablas automaticamente
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JPA - desactivar logs de SQL en produccion
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging - nivel INFO para produccion
logging.level.root=INFO
logging.level.com.upeu.gestioninventario=INFO
logging.level.org.springframework.graphql=WARN
logging.level.graphql.execution=WARN
logging.level.graphql.schema=WARN
